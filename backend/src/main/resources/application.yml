spring:
  application:
    name: slotly
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/slotly}
    username: ${DB_USER:slotly}
    password: ${DB_PASSWORD:slotly}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
