server:
  # Render and most PaaS pass the port to listen on in $PORT
  port: ${PORT:8080}

spring:
  application:
    name: slotly
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/slotly}
    username: ${DB_USER:slotly}
    password: ${DB_PASSWORD:slotly}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

slotly:
  jwt:
    # Override with JWT_SECRET outside local development (at least 32 bytes)
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
    issuer: slotly
    ttl: 1h

springdoc:
  swagger-ui:
    path: /swagger-ui.html
