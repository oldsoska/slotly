services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: slotly
      POSTGRES_USER: slotly
      POSTGRES_PASSWORD: slotly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotly"]
      interval: 5s
      retries: 10

  # Used from stage 4 (cache + notifications). Started now so the stack is complete.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"

  backend:
    build: ./backend
    profiles: ["app"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/slotly
      DB_USER: slotly
      DB_PASSWORD: slotly
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-me-0123456789}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
